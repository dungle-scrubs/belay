name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite (session-store log) is stable on Node 24; match local.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests
        run: pnpm test:integration
      - name: Web tests
        run: pnpm test:web
      # Hermetic e2e only; the live-model lane skips with a reason (no LMSTUDIO_URL in CI).
      - name: E2E tests
        run: pnpm test:e2e
