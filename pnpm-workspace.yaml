packages:
  - "apps/*"
  - "packages/*"
  - "e2e"
  - "tests/browser"
overrides:
  # Pin every Playwright surface to the version baked into the pinned browser container
  # (mcr.microsoft.com/playwright:v1.50.0-noble), so the host library, @storybook/test-runner's bundled
  # playwright, and the container's pre-installed browsers can never drift (plan 09.2 D-002).
  playwright: 1.50.0
  playwright-core: 1.50.0
  "@playwright/test": 1.50.0
allowBuilds:
  # The host resolves the ast-grep platform binary directly (tools/ast-grep-bin.ts), so its
  # postinstall wrapper is not needed - skip the build script.
  '@ast-grep/cli': false
  '@google/genai': false
  # @storybook/test-runner runs stories through jest, which transpiles via @swc/core's native addon.
  '@swc/core': true
  esbuild: true
  lefthook: true
  protobufjs: false
  # unrs-resolver ships prebuilt platform binaries; its postinstall build is not needed.
  unrs-resolver: false
  web-search: true
minimumReleaseAgeExclude:
  - '@tanstack/react-virtual@3.14.4'
  - '@tanstack/virtual-core@3.17.2'
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.199'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.199'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.199'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.199'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.199'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.199'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.199'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.199'
  - '@anthropic-ai/claude-agent-sdk@0.3.199'
